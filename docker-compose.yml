services:
  db:
    image: postgres:16
    container_name: trade-superstars-db
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: trade_superstars
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trade_superstars"]
      interval: 3s
      timeout: 5s
      retries: 20

  cache:
    image: redis:7
    container_name: trade-superstars-cache
    ports:
      - "6379:6379"
    # No persistence tuning and no volume: this cache is disposable. Losing it
    # costs a few Postgres queries, never data -- Postgres is the source of truth.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
